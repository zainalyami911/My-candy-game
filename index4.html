<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Sweet Crush - Match 3</title>
    <meta name="theme-color" content="#ff4d94" />
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root{
        --bg1:#0f1020; --bg2:#1b1e3c; --pink:#ff4d94; --yellow:#ffd166; --purple:#8b5cf6; --cyan:#22d3ee; --green:#22c55e; --orange:#fb923c; --red:#ef4444;
      }
      html,body{
        height:100%;
        margin:0;
        padding:0;
        background:radial-gradient(1200px 800px at 50% -10%, #2a2e63 0%, #14162e 45%, #0c0d1a 100%);
        font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial;
        color:#fff;
        overscroll-behavior:none;
        overflow:hidden;
      }
      .title-font{font-family:'Baloo 2', cursive;}
      .glass{background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));backdrop-filter: blur(10px);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);}
      .btn{transition:transform .08s ease, box-shadow .2s ease, background .2s ease;}
      .btn:active{transform:scale(.97);}
      .tile{
        position:absolute; width:var(--tile); height:var(--tile); border-radius:18px; 
        display:flex; align-items:center; justify-content:center; 
        user-select:none; -webkit-user-select:none; touch-action:none; 
        cursor:pointer; transition: transform .12s ease, filter .12s ease, opacity .2s ease;
      }
      .tile.dragging{transform:scale(1.08) rotate(2deg); z-index:10; filter:brightness(1.1);}
      .tile.spawn{animation:spawn .22s cubic-bezier(.2,.9,.2,1.1);}
      @keyframes spawn{from{transform:scale(.2) translateY(-40%); opacity:.2} to{transform:scale(1) translateY(0); opacity:1}}
      .tile.remove{animation:pop .22s ease forwards;}
      @keyframes pop{0%{transform:scale(1)} 60%{transform:scale(1.2)} 100%{transform:scale(0); opacity:0}}
      .candy{font-size:calc(var(--tile)*0.62); filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));}
      .board-wrap{position:relative; width:100%; aspect-ratio:1/1; max-width:520px; margin:0 auto;}
      .grid-bg{position:absolute; inset:0; border-radius:24px; background:rgba(255,255,255,.02); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);}
      .hud-chip{background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.1); padding:.35rem .6rem; border-radius:999px; display:inline-flex; align-items:center; gap:.4rem; backdrop-filter: blur(6px);}
      .hidden{display:none !important;}
    </style>
</head>
<body class="select-none">
    <div id="app" class="min-h-full flex flex-col">
      <header class="w-full sticky top-0 z-30 p-3">
        <div class="glass rounded-2xl px-3 py-2 flex items-center justify-between mx-auto max-w-5xl">
          <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-pink-500 grid place-items-center shadow-lg">🍬</div>
            <div class="title-font text-2xl">Sweet Crush</div>
          </div>
          <div class="flex items-center gap-2">
            <div class="hud-chip">🪙 <b id="coins">0</b></div>
            <button id="btnMute" class="hud-chip btn">🔊</button>
          </div>
        </div>
      </header>

      <main class="flex-1 flex flex-col items-center justify-center p-4">
        <section id="screen-start" class="glass rounded-3xl p-8 w-full max-w-lg text-center">
            <h1 class="title-font text-5xl mb-4">Sweet Blast</h1>
            <button id="btnPlay" class="btn px-10 py-4 rounded-2xl bg-pink-600 font-bold text-xl shadow-xl hover:brightness-110">Play Now</button>
        </section>

        <section id="screen-game" class="hidden w-full max-w-5xl flex flex-col gap-4">
            <div class="glass rounded-2xl p-3 flex justify-between items-center">
                <div class="hud-chip">Moves: <b id="hudMoves">20</b></div>
                <div class="hud-chip">Score: <b id="hudScore">0</b></div>
            </div>
            <div class="board-wrap glass rounded-3xl p-3 overflow-hidden">
                <canvas id="fx" class="absolute inset-0 pointer-events-none"></canvas>
                <div class="grid-bg"></div>
                <div id="board" class="absolute inset-3"></div>
            </div>
        </section>
      </main>
    </div>

    <script>
      // Service Worker registration for API 35
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(()=>{});
        });
      }

      const $ = sel => document.querySelector(sel);
      // Logic placeholder - اللعبة تحتاج سكريبت التشغيل الخاص بك هنا
      $('#btnPlay').onclick = () => {
          $('#screen-start').classList.add('hidden');
          $('#screen-game').classList.remove('hidden');
          // Start Game Engine here
      };
    </script>
</body>
</html>
